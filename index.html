<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Play Pippins Aplenty Online - in development</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="/src/main.ts" defer></script>
    <meta name="description" content="Play Pippins Aplenty Online is a place to play
        the trick-taking card game Pippins Aplenty against bot players
        in-browser.">
</head>

<body>
    <div id="new-game-button">New game</div>
    <div id="new-game-menu" hidden>
        <form id="new-game-form">

            <fieldset>
                <legend>Target score</legend>
                <input type="radio" name="targetscore" value="240" id="targetscore-240">
                <label for="targetscore-240">240</label>
                <input type="radio" name="targetscore" value="360" id="targetscore-360">
                <label for="targetscore-360">360</label>
                <input type="radio" name="targetscore" value="480" id="targetscore-480">
                <label for="targetscore-480">480</label>
                <input type="radio" name="targetscore" value="600" id="targetscore-600">
                <label for="targetscore-600">600</label>
                <input type="radio" name="targetscore" value="720" id="targetscore-720">
                <label for="targetscore-720">720</label>
                <input type="radio" name="targetscore" value="840" id="targetscore-840">
                <label for="targetscore-840">840</label>
                <input type="radio" name="targetscore" value="960" id="targetscore-960">
                <label for="targetscore-960">960</label>
                <input type="radio" name="targetscore" value="1080" id="targetscore-1080">
                <label for="targetscore-1080">1080</label>
                <input type="radio" name="targetscore" value="1200" id="targetscore-1200">
                <label for="targetscore-1200">1200</label>
            </fieldset>

            <button type="submit" id="play-now">Play Now</button>
        </form>
    </div>

    <div class="trumps" id="trump-holder"></div>

    <div class="config" id="config"></div>
    <div class="hand-number" id="hand-number"></div>
    <div class="scores-container">
        <div class="scores" id="scores">
            <span id="scores-breakdown"></span>
            <table class="scores-table" id="scores-table"></table>
        </div>
    </div>

    <div class="game-board">

        <div class="player-area comp1">
            <div class="played" id="played-comp1"></div>
        </div>

        <div class="player-area comp2">
            <div class="played" id="played-comp2"></div>
        </div>

        <div class="player-area comp3">
            <div class="played" id="played-comp3"></div>
        </div>

        <div class="player-area player">
            <div class="played" id="played-player"></div>
        </div>
    </div>

    <div class="previous-trick">
        <div class="prev-area">
            <div id="prev-comp1" class="prev-slot"></div>
            <div id="prev-comp2" class="prev-slot"></div>
            <div id="prev-comp3" class="prev-slot"></div>
            <div id="prev-player" class="prev-slot"></div>
        </div>
    </div>

    <div class="hand">
        <div id="player-hand"></div>
    </div>

</body>

</html>
